<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Satellite Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar: Controls -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>🛰️ Satellite Tracker</h1>
                <p class="subtitle">Live view of orbiting satellites</p>
            </div>

            <!-- Stats -->
            <div class="stats-section">
                <div class="stat">
                    <span class="stat-label">Active Satellites</span>
                    <span class="stat-value" id="satellite-count">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Last Updated</span>
                    <span class="stat-value" id="last-updated">--</span>
                </div>
            </div>

            <!-- Filters -->
            <div class="controls-section">
                <h3>Filter by Category</h3>
                <div class="filter-group">
                    <label>
                        <input type="checkbox" class="filter" value="gps" checked> GPS
                    </label>
                    <label>
                        <input type="checkbox" class="filter" value="communication" checked> Communication
                    </label>
                    <label>
                        <input type="checkbox" class="filter" value="weather" checked> Weather
                    </label>
                    <label>
                        <input type="checkbox" class="filter" value="iss" checked> ISS & Space Stations
                    </label>
                    <label>
                        <input type="checkbox" class="filter" value="other" checked> Other
                    </label>
                </div>
                <label class="toggle-row">
                    <input type="checkbox" id="show-orbits" checked> Show orbit paths <small id="orbit-hint"></small>
                </label>
                <button id="reset-filters" class="btn-secondary">Reset Filters</button>
            </div>

            <!-- Search -->
            <div class="controls-section">
                <h3>Search Satellites</h3>
                <input type="text" id="search-box" placeholder="Search by name (e.g., ISS)..." class="search-input">
                <button id="search-btn" class="btn-primary">Search</button>
                <button id="clear-search" class="btn-secondary">Clear</button>
            </div>

            <!-- Selected Satellite Info -->
            <div class="controls-section" id="info-panel" style="display: none;">
                <h3>Selected Satellite</h3>
                <div id="satellite-info"></div>
                <button id="close-info" class="btn-secondary">Close</button>
            </div>

            <!-- Loading Indicator -->
            <div id="loading" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Loading satellite data...</p>
            </div>

            <!-- Debug Console -->
            <div id="debug-console" style="display: none; margin-top: 16px; padding: 8px; background: #0a0a0a; border: 1px solid #333; border-radius: 4px; font-size: 11px; max-height: 150px; overflow-y: auto; font-family: monospace;">
            </div>
            <button id="toggle-debug" style="width: 100%; padding: 8px; margin-top: 8px; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; cursor: pointer; font-size: 12px;">📋 Show Debug Logs</button>

            <!-- Footer -->
            <div class="sidebar-footer">
                <p class="credit">
                    Data from <a href="https://celestrak.org/" target="_blank">CelesTrak</a> | 
                    Built with <a href="https://cesium.com/" target="_blank">CesiumJS</a>
                </p>
            </div>
        </aside>

        <!-- Main: 3D Globe -->
        <main class="main-content">
            <div id="cesiumContainer"></div>
            <div class="legend">
                <div class="legend-item">
                    <span class="legend-color" data-category="gps"></span> GPS
                </div>
                <div class="legend-item">
                    <span class="legend-color" data-category="communication"></span> Communication
                </div>
                <div class="legend-item">
                    <span class="legend-color" data-category="weather"></span> Weather
                </div>
                <div class="legend-item">
                    <span class="legend-color" data-category="iss"></span> ISS & Stations
                </div>
                <div class="legend-item">
                    <span class="legend-color" data-category="other"></span> Other
                </div>
            </div>
        </main>
    </div>

    <!-- Cesium JS via jsDelivr CDN (more reliable) -->
    <script src="https://cdn.jsdelivr.net/npm/cesium@1.115.0/Build/Cesium/Cesium.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.115.0/Build/Cesium/Widgets/widgets.css">
    <script>
        // Wait for Cesium to load before running app.js
        function waitForCesium() {
            if (typeof Cesium !== 'undefined') {
                loadApp();
            } else {
                console.log('Waiting for Cesium to load...');
                setTimeout(waitForCesium, 100);
            }
        }
        
        function loadApp() {
            const appScript = document.createElement('script');
            appScript.src = 'app.js';
            appScript.onerror = () => {
                if (document.getElementById('loading')) {
                    document.getElementById('loading').innerHTML = '<p style="color: #ff6b6b;">Error loading app. Check console.</p>';
                }
            };
            document.body.appendChild(appScript);
        }
        
        // Setup debug console
        setTimeout(() => {
            const toggleBtn = document.getElementById('toggle-debug');
            const debugConsole = document.getElementById('debug-console');
            
            if (toggleBtn && debugConsole && window.APP_LOGS) {
                toggleBtn.addEventListener('click', () => {
                    debugConsole.style.display = debugConsole.style.display === 'none' ? 'block' : 'none';
                    toggleBtn.textContent = debugConsole.style.display === 'none' ? '📋 Show Debug Logs' : '📋 Hide Debug Logs';
                    if (debugConsole.style.display === 'block') {
                        debugConsole.innerHTML = window.APP_LOGS.map(log => `<div>${log}</div>`).join('');
                        debugConsole.scrollTop = debugConsole.scrollHeight;
                    }
                });
                
                // Update debug console every 500ms
                setInterval(() => {
                    if (debugConsole.style.display === 'block' && window.APP_LOGS) {
                        // Only update if there are new logs
                        const currentHTML = debugConsole.innerHTML;
                        const newHTML = window.APP_LOGS.map(log => `<div>${log}</div>`).join('');
                        if (currentHTML !== newHTML) {
                            debugConsole.innerHTML = newHTML;
                            // Don't auto-scroll, let user control it
                        }
                    }
                }, 1000);
            }
        }, 1000);
        
        // Start waiting for Cesium
        waitForCesium();
    </script>
</body>
</html>
